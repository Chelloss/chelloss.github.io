<body>
<main>
<h1>Connecting…</h1>
<p>This page hands Facebook's one-time approval code to the channel owner's posting tool, which runs on the owner's
own computer. It stores nothing and sends nothing anywhere else.</p>
<p id="msg"></p>
</main>
<script>
// Facebook requires an HTTPS return address for a Live app; the owner's tool listens on this computer only.
if (location.search) {
  location.replace("http://localhost:8765/meta-callback" + location.search);
} else {
  document.getElementById("msg").textContent = "Nothing to do here.";
}
</script>
</body>
