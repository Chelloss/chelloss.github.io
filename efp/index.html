button{font:inherit;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
label{color:var(--muted);font-size:.9rem}#err{color:#d64545;min-height:1.2em}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:1}

.intro p{font-size:.9rem}

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.rounds,hash:"SHA-256"},
    k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},k,b(D.ct));
  document.getElementById("f").remove();
  const P=JSON.parse(new TextDecoder().decode(pt));
  const out=document.getElementById("out");
  out.innerHTML='<div class="intro">'+P.intro+'</div><nav></nav><div class="card" id="tab"></div>';
  const nav=out.querySelector("nav"), body=document.getElementById("tab");
  let cur=0;try{cur=+(localStorage.getItem("efp_tab")||0)}catch(_){}
  if(!(cur>=0&&cur<P.tabs.length))cur=0;
  function show(i){cur=i;body.innerHTML=P.tabs[i].html;
    [...nav.children].forEach((b,j)=>b.classList.toggle("on",j===i));
    try{localStorage.setItem("efp_tab",String(i))}catch(_){}}
  P.tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.name;b.onclick=()=>show(i);nav.appendChild(b)});
  show(cur);
}
const f=document.getElementById("f");
f.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;
  document.getElementById("err").textContent="Opening...";
  try{await open_(pw);try{if(document.getElementById("rem").checked)localStorage.setItem("efp_pw",pw)}catch(_){}}
  catch(_){document.getElementById("err").textContent="Wrong password";}};
let saved=null;try{saved=localStorage.getItem("efp_pw")}catch(_){}
if(saved)open_(saved).catch(()=>{try{localStorage.removeItem("efp_pw")}catch(_){}});
</script></body></html>
