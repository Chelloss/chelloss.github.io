<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coupons</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5b6470;--accent:#1f7a4d;--line:#e2e5ea}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f25;--text:#e8eaed;--muted:#9aa3ad;--accent:#4cc38a;--line:#2a3038}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
h1{font-size:1.35rem;margin:.2rem 0 .6rem}h2{font-size:1.15rem;margin:1.4rem 0 .4rem;color:var(--accent)}
h3{font-size:1rem;margin:1rem 0 .3rem}p{color:var(--muted);margin:.4rem 0}
ol,ul{padding-left:1.3rem;margin:.3rem 0}li{margin:.45rem 0}b{color:var(--text)}
form{display:flex;flex-direction:column;gap:10px;max-width:340px;margin:18vh auto 0}
input{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
button{font:inherit;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
label{color:var(--muted);font-size:.9rem}#err{color:#d64545;min-height:1.2em}
nav{display:flex;gap:6px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:1}
nav button{flex:1;padding:10px 6px;background:var(--card);color:var(--text);border:1px solid var(--line);font-weight:600}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.intro p{font-size:.9rem}
.sub{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;margin:0 -2px}
.sub button{flex:0 0 auto;padding:8px 12px;border-radius:999px;background:var(--bg);color:var(--text);
  border:1px solid var(--line);font-weight:600;font-size:.9rem}
.sub button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.card ol,.card ul{list-style:none;padding:0;margin:8px 0}
.card ol li,.card ul li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.meta{color:var(--muted);font-size:.9rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0 14px}
.big{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);text-align:center}
.big .k{color:var(--muted);font-size:.85rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big .v{font-size:1.55rem;font-weight:800;white-space:nowrap;color:var(--accent);line-height:1.2;margin-top:4px}
.big.neg .v{color:#d64545}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem;white-space:nowrap}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase}
tbody tr:last-child td{border-top:2px solid var(--line);border-bottom:0}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;
  background:var(--accent);color:#fff;margin-right:4px}
</style></head><body><main>
<form id="f"><h1>Coupons</h1>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<label><input id="rem" type="checkbox"> Remember on this device</label>
<button>Open</button><div id="err"></div></form>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.salt),iterations:D.rounds,hash:"SHA-256"},
    k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.iv)},k,b(D.ct));
  document.getElementById("f").remove();
  const P=JSON.parse(new TextDecoder().decode(pt));
  const out=document.getElementById("out");
  out.innerHTML='<div class="intro">'+P.intro+'</div><nav></nav><div class="card" id="tab"></div>';
  const nav=out.querySelector("nav"), body=document.getElementById("tab");
  let cur=0;try{cur=+(localStorage.getItem("efp_tab")||0)}catch(_){}
  if(!(cur>=0&&cur<P.tabs.length))cur=0;
  function show(i){cur=i;const T=P.tabs[i];body.innerHTML=T.html;
    [...nav.children].forEach((b,j)=>b.classList.toggle("on",j===i));
    try{localStorage.setItem("efp_tab",String(i))}catch(_){}
    if(T.subs&&T.subs.length){const sn=document.createElement("div");sn.className="sub";const sb=document.createElement("div");
      body.appendChild(sn);body.appendChild(sb);
      const pick=k=>{sb.innerHTML=T.subs[k].html;[...sn.children].forEach((b,j)=>b.classList.toggle("on",j===k));};
      T.subs.forEach((s,k)=>{const b=document.createElement("button");b.textContent=s.name;b.onclick=()=>pick(k);sn.appendChild(b)});
      pick(0);}}
  P.tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t.name;b.onclick=()=>show(i);nav.appendChild(b)});
  show(cur);
}
const f=document.getElementById("f");
f.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById("pw").value;
  document.getElementById("err").textContent="Opening...";
  try{await open_(pw);try{if(document.getElementById("rem").checked)localStorage.setItem("efp_pw",pw)}catch(_){}}
  catch(_){document.getElementById("err").textContent="Wrong password";}};
let saved=null;try{saved=localStorage.getItem("efp_pw")}catch(_){}
if(saved)open_(saved).catch(()=>{try{localStorage.removeItem("efp_pw")}catch(_){}});
</script></body></html>
